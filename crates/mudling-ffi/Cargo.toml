[package]
name = "mudling-ffi"
description = "UniFFI bindings to mudling-core for the iOS shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# Generates the Swift bindings: scripts/build-ios.sh runs it.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
mudling-core.workspace = true
uniffi.workspace = true

[lints]
workspace = true
