[package]
name = "mudling-core"
description = "MUDling's core: everything except drawing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1"
cpu-time = "1"
memchr.workspace = true
mlua = { version = "0.12", features = ["luau", "vendored"] }
regex = "1.12"
regex-automata = "0.4"
regex-syntax = "0.8"
serde.workspace = true
serde_json.workspace = true
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
rusqlite.workspace = true
directories.workspace = true
imbl = "7"
bytes.workspace = true
flate2.workspace = true
git2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake2 = { version = "0.11", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
data-encoding = "2"
getrandom = "0.4"
keyring-core = "1"
tempfile.workspace = true
unicode-normalization = "0.1"
zeroize = "1"
zxcvbn = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
