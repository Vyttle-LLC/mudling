[package]
name = "mudling-core"
description = "MUDling's core: everything except drawing."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "1.1"
memchr = "2.7"
mlua = { version = "0.12", features = ["luau", "vendored"] }
regex = "1.12"
regex-automata = "0.4"
regex-syntax = "0.8"
serde.workspace = true
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[lints]
workspace = true
