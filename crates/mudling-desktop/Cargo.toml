[package]
name = "mudling-desktop"
description = "MUDling's desktop shell, drawn with gpui on macOS, Windows and Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mudling-desktop"
path = "src/main.rs"

[features]
# `--map-harness --shot` needs gpui's offscreen rendering, built for tests.
shots = ["gpui/test-support", "gpui_platform/test-support"]

[dependencies]
mudling-core.workspace = true
aho-corasick = "1.1"
mudling-plugin-avatar = { path = "../../plugins/avatar" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
futures = "0.3"
memory-stats = "1"
# Watches the plugin folders a player adds, by the OS's own file events.
notify = "8"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { package = "gpui-pre-apple", version = "=0.3.10", features = ["font-kit"] }

[lints]
workspace = true
