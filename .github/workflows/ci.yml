name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install gpui's Linux libraries
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  build:
    name: Build, test and bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gpui's Linux libraries (X11 and Wayland)
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      # Reads the window's accessibility tree from inside the app, as
      # VoiceOver would see it; exits non-zero if a check fails.
      - name: Accessibility check (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/mudling-desktop --synthetic --ax-check
      # The committed synthetic fixture: session logs hold other players' chat
      # and are never committed. Misses any PRD §6 budget a headless run can
      # measure and it fails; the frame and map pan budgets need a window. Noise
      # only adds time, so a miss must repeat in a second whole run: a build
      # that can meet a budget does so in one run, and one that can't, in none.
      - name: Replay benchmark (gates the §6 budgets)
        shell: bash
        run: |
          cargo run --release -p mudling-bench -- --check --json bench-report.json ||
            cargo run --release -p mudling-bench -- --check --json bench-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ matrix.os }}
          path: bench-report.json

  # Fails a pull request that loses more than 10% against its base. Both builds
  # run in this job, on this machine, in turns: see the bench's compare.rs.
  bench-regression:
    name: Benchmark against the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pull request that adds this job has no comparable base: its base
      # times a different plugin set. Every later one does.
      - name: Compare with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add ../base "$BASE_SHA"
          if [ ! -f ../base/crates/mudling-bench/src/compare.rs ]; then
            echo "The base predates the comparison: nothing to compare."
            exit 0
          fi
          cargo build --release -p mudling-bench --manifest-path ../base/Cargo.toml --target-dir target
          cp target/release/mudling-bench ../base-bench
          # A lasting slow spell can beat one comparison, not a second.
          cargo run --release -p mudling-bench -- compare ../base-bench --json bench-compare.json ||
            cargo run --release -p mudling-bench -- compare ../base-bench --json bench-compare.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-compare
          path: bench-compare.json
          if-no-files-found: ignore

  # Keeps the core mobile-ready (PRD §4 goal 5): mudling-ffi builds for the
  # device and the simulator, as an XCFramework with Swift bindings.
  ios-build:
    name: iOS core build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the XCFramework and Swift bindings
        run: scripts/build-ios.sh
      - name: Type-check the Swift bindings
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck
          -target arm64-apple-ios17.0-simulator
          -Xcc -fmodule-map-file=target/ios/headers/module.modulemap
          -I target/ios/headers target/ios/swift/mudling_ffi.swift
