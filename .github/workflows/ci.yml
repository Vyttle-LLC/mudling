# Correctness only: what a pull request must not break. Nothing here measures
# speed or waits on a short timer; that runs only on demand (profile.yml), so a
# slow runner can't fail a pull request, main or a release. docs/ci.md says
# which is which.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Install gpui's Linux libraries
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  build:
    # The name keeps "bench" from before the benchmark moved to profile.yml, so
    # a ruleset's required checks by this name still report.
    name: Build, test and bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The release build, the debug test build and the cache together fill a
      # stock Linux runner's disk; these preinstalled tools are never used.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install gpui's Linux libraries (X11 and Wayland)
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --release
      # Correctness only: the timing tests are ignored here and run in the
      # profile.
      # --no-fail-fast, so one failing test binary can't hide the others.
      - run: cargo test --workspace --no-fail-fast
      # Reads the window's accessibility tree from inside the app, as
      # VoiceOver would see it; exits non-zero if a check fails.
      - name: Accessibility check (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/mudling-desktop --synthetic --ax-check

  # Keeps the core mobile-ready (PRD §4 goal 5): mudling-ffi builds for the
  # device and the simulator, as an XCFramework with Swift bindings.
  ios-build:
    name: iOS core build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the XCFramework and Swift bindings
        run: scripts/build-ios.sh
      - name: Type-check the Swift bindings
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck
          -target arm64-apple-ios17.0-simulator
          -Xcc -fmodule-map-file=target/ios/headers/module.modulemap
          -I target/ios/headers target/ios/swift/mudling_ffi.swift
