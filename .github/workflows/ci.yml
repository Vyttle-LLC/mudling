# Correctness only: what a pull request must not break. Anything that judges
# speed runs daily instead (daily.yml), where a slow runner can't block a
# merge. docs/ci.md says which is which.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs all of CI before it builds anything.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install gpui's Linux libraries
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --release -- -D warnings

  build:
    # The name keeps "bench" from before the benchmark moved to daily.yml, so
    # a ruleset's required checks by this name still report.
    name: Build, test and bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gpui's Linux libraries (X11 and Wayland)
        if: runner.os == 'Linux'
        run: scripts/install-linux-deps.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      # Correctness only: the timing tests are ignored here and run daily.
      # --no-fail-fast, so one failing test binary can't hide the others.
      - run: cargo test --workspace --no-fail-fast
      # Reads the window's accessibility tree from inside the app, as
      # VoiceOver would see it; exits non-zero if a check fails.
      - name: Accessibility check (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/mudling-desktop --synthetic --ax-check

  # Keeps the core mobile-ready (PRD §4 goal 5): mudling-ffi builds for the
  # device and the simulator, as an XCFramework with Swift bindings.
  ios-build:
    name: iOS core build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Build the XCFramework and Swift bindings
        run: scripts/build-ios.sh
      - name: Type-check the Swift bindings
        run: >
          xcrun --sdk iphonesimulator swiftc -typecheck
          -target arm64-apple-ios17.0-simulator
          -Xcc -fmodule-map-file=target/ios/headers/module.modulemap
          -I target/ios/headers target/ios/swift/mudling_ffi.swift
