# Where Aardwolf keeps each vital. char.vitals holds only the current hp,
# mana and moves, which MUDling learns by their common names. The maximums
# are in char.maxstats, experience to the next level in char.status, and a
# level's whole experience in char.base.
[vitals]
maxhp = "char.maxstats.maxhp"
maxmana = "char.maxstats.maxmana"
maxmoves = "char.maxstats.maxmoves"
tnl = "char.status.tnl"
maxtnl = "char.base.perlevel"

# The character sheet: who the character is in char.base, the stats in
# char.stats, the purse in char.worth. char.status gives the level, under
# the defaults' `Char.Status.level`, and the position: "Standing".
[character]
name = "char.base.name"
race = "char.base.race"
class = "char.base.class"
str = "char.stats.str"
int = "char.stats.int"
wis = "char.stats.wis"
dex = "char.stats.dex"
con = "char.stats.con"
luck = "char.stats.luck"
hitroll = "char.stats.hr"
damroll = "char.stats.dr"
saves = "char.stats.saves"
position = "char.status.pos"
alignment = "char.status.align"
gold = "char.worth.gold"
practice = "char.worth.pracs"

# The opponent: char.status names it, empty out of a fight, and gives its
# health only as a percentage.
[opponent]
name = "char.status.enemy"
percent = "char.status.enemypct"
