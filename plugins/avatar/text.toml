# Avatar's text: the prompt, the pager, and the lines no other point reads.
# Tables are in character.toml and gear.toml; moves in map.toml; mobs in
# mobs.toml.
#
# Avatar sends no GA or EOR, so a prompt is known by its shape, the
# `prompt` fragment in plugin.toml. Output often arrives glued after a
# prompt on the same line, so patterns for a line that may be the first
# after one start `^\s*{prompt}?\s*`. A custom prompt can leave a space in
# front of the next line: "<46/46hp><116/116m><116/116mv>", then " You are
# using:".

# The pager, which arrives without a line end: "[B]ack,[H]elp,[R]efresh,
# or [C]ontinue: ". "c" continues.
[pager]
prompt = '''\[C\]ontinue: ?$'''
key = "c"

# A prompt: "(110h-125m-120v-1062)(-/-)", alone or with output glued after
# it. Half a prompt, as a network read can split one ("(271h-17"), doesn't
# match.
[[prompt]]
pattern = '''^{prompt}'''

# The greeting on login, its last word before the punctuation the name:
# "Welcome back to the AVATAR System, Hero Bren." or "Welcome back to the
# AVATAR System Bren, hope you get beyond level ...".
[[pattern]]
name = "character.welcome"
pattern = '''^{prompt}?Welcome back to the AVATAR System,?(?: \w+)* (?<name>\w+)(?:[,.!]|\s*$)'''
hook = "on_welcome"

# `aff` with nothing on: Avatar's "You are not under the affects of any
# spells", or the ROM wording "You are not affected by any spells". A whole
# answer on one line, so no table.
[[pattern]]
name = "character.affects.none"
pattern = '''^\s*{prompt}?\s*You are not (?:under the affects of|affected by) any'''
hook = "on_no_affects"

# Spells landing and wearing off, and gear that grants affects: "You feel
# more frail.", "Your armor spell wears off."
[[pattern]]
name = "character.affects_changed"
pattern = '''^\s*{prompt}?\s*You feel |wears off'''

# A zone as Avatar names it. It shows in text in "You see a vision of your
# corpse in:" and the area list.
[[pattern]]
name = "map.area"
pattern = '''^{area}$'''
