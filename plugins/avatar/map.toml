# Avatar's map. It sends GMCP Room.Info with no room number, so a room is
# known by its name, exits and description.
room_identity = "description"

# Room.Info's zone, as the `area` fragment in plugin.toml reads it.
area_name = '''^{area}$'''

# A door opened or shut in place brings no Room.Info: Char.Status lists the
# room's exits again, as Room.Info does, `"room_exits": {"North": "C"}`.
room_exits = "Char.Status.room_exits"

# "[Exits: north up]": the room's description follows it, which tells apart
# rooms that share a name and exits.
[[exits]]
name = "map.exits"
pattern = '''^\s*{prompt}?\[Exits:'''

# Moves the game refuses without a Room.WrongDir.
[[failed_move]]
name = "map.failed_move"
pattern = '''No way!\s+You are still fighting!|You are too exhausted'''

# The room name of a room too dark to see; it looks like every other.
[[darkness]]
name = "map.darkness"
pattern = '''^\s*{prompt}?\s*It is pitch black\.\.\.$'''

# "You flee north! What a COWARD!": the way a flee went.
[[flee]]
name = "map.flee"
pattern = '''You flee (?<dir>north|east|south|west|up|down)'''

# These rooms look the same and their paths don't add up. The rest of the
# area holds still.
[[maze]]
area = "Brothers Grimm"
rooms = ["Lost in the Dark Woods"]
